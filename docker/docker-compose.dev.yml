# 开发: 只起 postgres,前后端本地 pnpm dev(Vite proxy → server)
# 数据落 workspace/(宿主机持久化,重置=删 workspace/postgres-dev 目录)
services:
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: sims
      POSTGRES_PASSWORD: sims
      POSTGRES_DB: agent_sims
    volumes:
      - ../workspace/postgres-dev:/var/lib/postgresql/data
