# agent-sims web 反代配置:SPA 静态托管 + API/WS 反代 app 容器
server {
    listen 9000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # SPA 前端路由回退(如 /admin 直开)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 存活探测(compose healthcheck / frpc 探针):反代到 app /health
    location = /health {
        proxy_pass http://app:3100/health;
    }

    location /api/ {
        proxy_pass http://app:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # Socket.IO(M2.5 同步层):websocket 升级头必备
    location /socket.io/ {
        proxy_pass http://app:3100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }
}
