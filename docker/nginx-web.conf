# agent-sims web 反代配置:SPA 静态托管 + API/WS 反代 app 容器
server {
    listen 9000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 素材库发布产物(M-L.3):挂载 workspace/assets-published,admin 发布即时生效;
    # 未发布时 404(前端给出"请先发布"引导,不吞进 SPA 回退)
    location /assets/library/ {
        alias /publish/library/;
    }
    location = /assets/manifest.json {
        alias /publish/manifest.json;
    }

    # SPA 前端路由回退(如 /admin 直开)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 存活探测(compose healthcheck / frpc 探针):反代到 app /health
    location = /health {
        proxy_pass http://app:3100/health;
    }

    location /api/ {
        proxy_pass http://app:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # /debug 调试端点(仅 development 构建生效;供页面倍率/生成等控制面使用)
    location /debug/ {
        proxy_pass http://app:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # Socket.IO(M2.5 同步层):websocket 升级头必备
    location /socket.io/ {
        proxy_pass http://app:3100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }
}
