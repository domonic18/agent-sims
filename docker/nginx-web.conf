# agent-sims web 反代配置:SPA 静态托管 + API/WS 反代 app 容器
# OPS-2 公开 API 限流(按客户端真实 IP 两档,conf.d 包含于 http 上下文可直接声明 zone):
# 常规 API 30r/s(burst 60 吸页面加载瞬时并发);登录口 6r/m(失败锁定在应用层另有双键计数)
limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=api_login:10m rate=6r/m;

server {
    listen 9000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 素材库发布产物(M-L.3):挂载 workspace/assets-published,admin 发布即时生效;
    # 未发布时 404(前端给出"请先发布"引导,不吞进 SPA 回退)。
    # 缓存策略(L2): manifest 始终协商(etag 304,发布即失效);散图 1h 强缓存,
    # 过期后 304 复用——慢网络省掉每次 136KB 清单全量重下与散图重复传输
    location = /assets/manifest.json {
        alias /publish/manifest.json;
        add_header Cache-Control "no-cache";
    }
    location ^~ /assets/library/ {
        alias /publish/library/;
        expires 1h;
    }

    # vite 哈希产物内容寻址,长缓存跨部署复用(游戏代码迭代不再重拉 Phaser ~400KB)
    location ~* /assets/.+\.(js|css|woff2)$ {
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # SPA 入口始终协商:新部署后立即拿到新哈希资源清单
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA 前端路由回退(如 /admin 直开)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 存活探测(compose healthcheck / frpc 探针):反代到 app /health
    location = /health {
        proxy_pass http://app:3100/health;
    }

    # XFF 覆写(非追加,OPS-2):nginx 是信任边界,防止客户端自带 X-Forwarded-For 伪造
    # 源 IP 骗过应用层按 IP 的防暴力/限流;应用侧 Fastify trustProxy 由此取真实 IP
    location /api/ {
        limit_req zone=api_general burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://app:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 60s;
    }

    # 登录口独立更严限流(6r/m + burst 5):拖慢密码喷洒,细粒度锁定由应用层负责
    location = /api/admin/auth/login {
        limit_req zone=api_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://app:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 60s;
    }

    # /debug 调试端点(仅 development 构建生效;供页面倍率/生成等控制面使用)
    location /debug/ {
        limit_req zone=api_general burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://app:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 60s;
    }

    # Socket.IO(M2.5 同步层):websocket 升级头必备
    location /socket.io/ {
        proxy_pass http://app:3100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 86400s;
    }
}
