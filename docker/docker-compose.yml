# 生产: web(9000 对外,frpc 穿透目标) + app + postgres 三容器;配置走根目录 .env
# 项目名固定 agent-sims;dev 库用 docker-compose.dev.yml -p agent-sims-dev,勿混用
# 数据落 workspace/(宿主机持久化,备份=pg_dump → workspace/backups)
# 调用须在仓库根目录且显式传根 .env(compose 默认只找 compose 文件所在目录,变量插值与项目名均依赖它):
#   docker compose -f docker/docker-compose.yml -p agent-sims --env-file .env build && \
#   docker compose -f docker/docker-compose.yml -p agent-sims --env-file .env up -d
services:
  postgres:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: sims
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sims}
      POSTGRES_DB: agent_sims
    volumes:
      # pg18 官方镜像起 PGDATA 改为版本相关路径(/var/lib/postgresql/18/docker),
      # 挂上层目录才是版本无关写法;挂 /data 旧路径会因无数据目录直接退出
      - ../workspace/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sims -d agent_sims"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
    restart: unless-stopped
    volumes:
      # 素材库文件(管理侧源头,发布产物由此生成)
      - ../workspace/asset-library:/app/workspace/asset-library
      # 发布产物(与 web/nginx 共享,admin 发布即时生效)
      - ../workspace/assets-published:/publish
    env_file: ../.env
    environment:
      # 默认 production(关闭 /debug/*);本地验证栈可在根 .env 置 development 打开调试端点
      NODE_ENV: ${NODE_ENV:-production}
      ASSET_LIBRARY_ROOT: /app/workspace/asset-library
      ASSETS_PUBLISH_TARGET: /publish
      DATABASE_URL: postgres://sims:${POSTGRES_PASSWORD:-sims}@postgres:5432/agent_sims
    ports:
      - "${GAME_PORT:-3100}:3100" # 调试/Spike① 脚本直连;常规入口走 web 9000
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1 而非 localhost:node 仅绑 IPv4,容器内 localhost 解析 ::1 会被拒
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3100/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s # 首启含 migrate+seed

  db-backup:
    # 每日全库备份 sidecar(与 postgres 同镜像复用 pg_dump):启动即备一份,之后每 24h 一轮,
    # 落 workspace/backups/agent_sims-*.sql.gz 保留 14 天。防数据卷被清后素材/世界丢失;
    # 恢复姿势见 docker/restore-db.sh(单事务灌回,dump 自含 setval 序列位)
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-sims}
    volumes:
      - ../workspace/backups:/backups
    command:
      - sh
      - -c
      - |
        while :; do
          ts=$$(date +%Y%m%d-%H%M%S)
          pg_dump -h postgres -U sims -d agent_sims --data-only | gzip > /backups/agent_sims-$$ts.sql.gz.tmp \
            && mv /backups/agent_sims-$$ts.sql.gz.tmp /backups/agent_sims-$$ts.sql.gz \
            || echo "[db-backup] 备份失败: agent_sims-$$ts(下轮重试)"
          rm -f /backups/agent_sims-$$ts.sql.gz.tmp
          find /backups -name 'agent_sims-*.sql.gz' -mtime +14 -delete
          sleep 86400
        done

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
      # 构建信息注入(OPS-1,游戏页右下角展示):compose 变量插值读当前 shell/.env,
      # 构建姿势: BUILD_SHA=$(git rev-parse --short HEAD) BUILD_TIME="$(date '+%F %H:%M')" \
      #   docker compose -f docker/docker-compose.yml -p agent-sims --env-file .env build web
      args:
        BUILD_SHA: ${BUILD_SHA:-}
        BUILD_TIME: ${BUILD_TIME:-}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-9000}:9000"
    volumes:
      # 素材发布产物(app 写入,nginx 经 /assets/library/ 提供)
      - ../workspace/assets-published:/publish:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
