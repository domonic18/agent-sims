<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>agent-sims</title>
    <!-- 首字节加载屏(L1):JS chunk 下载期(慢网络 393KB gzip)的即时反馈;
         React 挂载后由 main.tsx 摘除。配色复制自 theme.css(Sweetie-16),样式孪生 BootScreen.tsx -->
    <style>
      #boot-screen {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: #1a1c2c;
        font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
      }
      #boot-screen .box {
        width: 340px;
        background: #1a1c2c;
        padding: 4px;
      }
      #boot-screen .inner {
        background: #333c57;
        box-shadow: inset 0 0 0 2px #566c86;
        padding: 20px 18px;
        text-align: center;
      }
      #boot-screen .title {
        color: #ffcd75;
        font-family: monospace;
        font-size: 17px;
        font-weight: 700;
        letter-spacing: 1px;
        text-shadow: 2px 2px 0 #1a1c2c;
        margin-bottom: 16px;
      }
      #boot-screen .bar {
        height: 14px;
        background: #1a1c2c;
        border: 2px solid #566c86;
        margin-bottom: 12px;
        overflow: hidden;
      }
      #boot-screen .bar i {
        display: block;
        height: 100%;
        width: 36%;
        background: #38b764;
        animation: boot-slide 1.1s steps(12) infinite;
      }
      @keyframes boot-slide {
        from { margin-left: -36%; }
        to { margin-left: 100%; }
      }
      #boot-screen .text { color: #f4f4f4; font-size: 13px; margin-bottom: 6px; }
      #boot-screen .tip { color: #94b0c2; font-size: 11px; }
    </style>
  </head>
  <body>
    <div id="boot-screen">
      <div class="box">
        <div class="inner">
          <div class="title">AGENT·SIMS</div>
          <div class="bar"><i></i></div>
          <div class="text">正在加载游戏引擎…</div>
          <div class="tip">像素小镇 · 加载中请稍候</div>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
